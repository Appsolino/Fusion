# FNXC:AppsolinoAuto2 2026-07-31-18:00:
# Trusted decision/finalizer trust zone. Workflow code always from Appsolino main.
# Does not execute candidate package scripts. Mints App installation token only here.
# Recomputes risk from GitHub API with trusted classifier. Exact-head merge for low-risk only.
# FNXC:AppsolinoAuto3 2026-08-01-01:20: After eligible low-risk merge to main, dispatches AUTO-3 and waits for DEPLOYED. Never executes candidate package scripts.
# FNXC:AppsolinoAuto2SensitiveApproval 2026-08-01-04:55:
# Sensitive without verified exact-head owner review → approval-required (no merge).
# Sensitive with verified Anas966 APPROVED on exact head → merge + AUTO-3 (also via upstream-auto2-approve-sensitive.yml).
# A raw --owner-approved flag alone is not authorization.

name: Upstream AUTO-2 Finalize

on:
  workflow_run:
    workflows: ["Upstream AUTO-2 Validate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to finalize"
        required: true
        type: string
      validated_head:
        description: "Exact head SHA that was validated"
        required: true
        type: string
      validation_conclusion:
        description: "success|failure|cancelled"
        required: true
        default: success
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Per-PR/head so sequential proofs are not cancelled by a global lock.
  group: auto2-finalize-${{ github.event.inputs.pr_number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Trusted classify + controlled merge
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != ''
    steps:
      - name: Require Appsolino Automation GitHub App credentials
        env:
          APP_ID: ${{ secrets.APPSOLINO_AUTOMATION_APP_ID }}
          APP_KEY: ${{ secrets.APPSOLINO_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID}" || -z "${APP_KEY}" ]]; then
            echo "::error::AUTO-2 fail-closed: App credentials missing"
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APPSOLINO_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.APPSOLINO_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-actions: write

      - name: Checkout trusted workflow code
        uses: actions/checkout@v6
        with:
          # workflow_run: always Appsolino main. workflow_dispatch: allow proof from feature ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve PR + validated SHA
        id: meta
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD: ${{ inputs.validated_head }}
          INPUT_CONC: ${{ inputs.validation_conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_CONC: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR="$INPUT_PR"
            VSHA="$INPUT_HEAD"
            VCONC="$INPUT_CONC"
          else
            VSHA="$RUN_HEAD"
            VCONC="$RUN_CONC"
            PR="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
            if [[ -z "$PR" ]]; then
              # Same-repo PRs sometimes omit pull_requests on workflow_run — resolve by head branch.
              PR="$(gh api "repos/${REPO}/pulls?state=open&head=${REPO%%/*}:${RUN_BRANCH}&per_page=5" --jq '.[0].number // empty')"
            fi
          fi
          if [[ -z "${PR}" || -z "${VSHA}" ]]; then
            echo "::error::Unable to resolve PR/validated head for AUTO-2 finalize (pr='${PR}' sha='${VSHA}')"
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "validated_head=$VSHA" >> "$GITHUB_OUTPUT"
          echo "validation_conclusion=$VCONC" >> "$GITHUB_OUTPUT"

      - name: Configure App git/gh auth (trusted zone only)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/auto2-gh-config
        run: |
          set -euo pipefail
          mkdir -p "$GH_CONFIG_DIR"
          gh auth setup-git

      - name: Run trusted finalizer
        id: fin
        env:
          AUTO2_GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/auto2-gh-config
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$GH_CONFIG_DIR"
          set +e
          node infra/scripts/auto2-finalize.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ steps.meta.outputs.pr }}" \
            --validated-head "${{ steps.meta.outputs.validated_head }}" \
            --validation-conclusion "${{ steps.meta.outputs.validation_conclusion }}" \
            --json > /tmp/auto2-finalize.json
          code=$?
          set -e
          cat /tmp/auto2-finalize.json
          # FNXC:AppsolinoAuto3Handoff 2026-08-01-08:30:
          # Exit policy must run even if step-summary formatting fails. Nested escaped quotes in python -c caused SyntaxError after a successful DEPLOYED proof (run 30691423651) and falsely failed the parent.
          action="$(python3 -c 'import json;print(json.load(open("/tmp/auto2-finalize.json"))["action"])')"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          {
            echo "## AUTO-2 finalize"
            echo
            python3 -c 'import json;d=json.load(open("/tmp/auto2-finalize.json"));a=d.get("auto3") or {};print("- action: `"+str(d.get("action"))+"`");print("- handoff_id: `"+(a.get("handoffId") or "n/a")+"`");print("- auto3_run_id: `"+(str(a.get("auto3RunId") or "n/a"))+"`");print("- auto3_status: `"+(a.get("status") or "n/a")+"`");print("- source_sha: `"+(a.get("sourceSha") or d.get("mergedMainSha") or "n/a")+"`")'
            echo
            echo '```json'
            cat /tmp/auto2-finalize.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # FNXC:AppsolinoAuto3Handoff 2026-08-01-06:50: Durable nonzero for deploy terminals; exit 0 only for DEPLOYED/IDEMPOTENT_NOOP (auto-merged-deployed) or non-deploy success paths.
          case "$action" in
            auto-merged|auto-merged-deployed|already-merged-idempotent)
              exit 0
              ;;
            expert-resolving|ai-verifying|refresh-required|blocked-policy|blocked-unresolved|approval-required)
              # FNXC:UpstreamFreshness 2026-08-07-04:30:
              # Durable non-merge outcomes. Workflow succeeds so expert/refresh can continue;
              # overall freshness remains unhealthy until integratedUpstreamSha matches upstreamHead.
              exit 0
              ;;
            auto-merged-deploy-rolled-back|auto-merged-deploy-critical|auto-merged-deploy-failed|blocked)
              exit 2
              ;;
            *)
              if [[ "$code" -eq 1 ]]; then exit 2; fi
              exit 0
              ;;
          esac

      - name: Dispatch upstream expert resolver or AUTO-1 refresh
        if: steps.fin.outputs.action == 'expert-resolving' || steps.fin.outputs.action == 'refresh-required'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/auto2-gh-config
          ACTION: ${{ steps.fin.outputs.action }}
          PR: ${{ steps.meta.outputs.pr }}
          HEAD: ${{ steps.meta.outputs.validated_head }}
        run: |
          set -euo pipefail
          # FNXC:UpstreamSensitiveExpert 2026-08-07-04:30:
          # SENSITIVE continues to rolling AUTO-1 refresh or expert resolve — not owner parking.
          if [[ "$ACTION" == "refresh-required" ]]; then
            gh workflow run upstream-auto1.yml --repo "$GITHUB_REPOSITORY"
            echo "Dispatched AUTO-1 refresh for live upstream HEAD"
          else
            gh workflow run upstream-auto2-expert-resolve.yml --repo "$GITHUB_REPOSITORY" \
              -f pr_number="$PR" \
              -f validated_head="$HEAD" || {
              echo "::warning::expert-resolve workflow missing or dispatch failed — state remains expert-resolving/blocked-unresolved"
            }
          fi

      - name: Guard — Host D only via AUTO-3 workflow
        run: |
          set -euo pipefail
          echo "AUTO-2 must not SSH/install Host D directly; deploy is delegated to upstream-auto3-deploy.yml."
