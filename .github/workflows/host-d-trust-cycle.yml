# FNXC:HostDTrust 2026-08-06:
# Durable Host D trust-hardening cycle controller for programme #109.
# Continues when interactive Cursor sessions close. Discovers existing AUTO-3
# runs before any dispatch. Host P credentials must not be present.
# Does not reopen programme #78 or issue #105.

name: Host D Trust Cycle

on:
  schedule:
    # Hourly — discover → reconcile/decide → at most one eligible dispatch.
    # Equivalent to execute-next + execute=true, with discover-before-dispatch guards.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "If true with mode=execute-next, may dispatch one eligible AUTO-3 (skipped when in-flight). Ignored for reconcile-only. Schedule always executes."
        required: false
        type: boolean
        default: false
      mode:
        description: "reconcile-only (never dispatch) | decide (dry) | execute-next (dispatch if eligible). Schedule forces execute-next."
        required: false
        type: choice
        options:
          - reconcile-only
          - decide
          - execute-next
        default: decide

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: host-d-trust-cycle
  cancel-in-progress: false

jobs:
  cycle:
    name: Reconcile trust ledger + next eligible step
    runs-on: [self-hosted, appsolino-fusion]
    steps:
      - name: Refuse Host P / production secrets in this job
        env:
          HOST_P_DEPLOY_SSH_KEY: ${{ secrets.HOST_P_DEPLOY_SSH_KEY }}
          HOST_P_KNOWN_HOSTS: ${{ secrets.HOST_P_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -n "${HOST_P_DEPLOY_SSH_KEY:-}" || -n "${HOST_P_KNOWN_HOSTS:-}" ]]; then
            echo "::error::Host P secrets must not be available to Host D trust cycle"
            exit 1
          fi
          echo "host-p-secrets-absent"

      - name: Checkout Appsolino main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub App token (issues + actions dispatch)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APPSOLINO_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.APPSOLINO_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Fusion
          permission-issues: write
          permission-actions: write
          permission-contents: read

      - name: Unit-test trust-cycle controller
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          node --test infra/scripts/steward/programme/__tests__/host-d-trust-cycle.test.mjs

      - name: Decide next action (discover runs first)
        id: decide
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          EXECUTE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.execute || false }}
          MODE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'decide' }}
          HOST_D_TRUST_RUNTIME_LEDGER: /srv/appsolino-fusion/staging/state/host-d-trust-runtime.json
        run: |
          set -euo pipefail
          # Schedule ≡ execute-next + execute=true. reconcile-only never dispatches.
          MODE="$MODE_INPUT"
          EXECUTE="$EXECUTE_INPUT"
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            MODE=execute-next
            EXECUTE=true
          fi
          if [[ "$MODE" == "reconcile-only" ]]; then
            EXECUTE=false
          fi
          ARGS=()
          if [[ "$EXECUTE" == "true" && "$MODE" == "execute-next" ]]; then
            ARGS+=(--execute)
          fi
          echo "controller_mode=$MODE execute=$EXECUTE event=$EVENT_NAME"
          node infra/scripts/steward/programme/host-d-trust-cycle.mjs "${ARGS[@]}" | tee "$RUNNER_TEMP/trust-cycle-report.json"
          ACTION=$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/trust-cycle-report.json"))["decision"]["action"])')
          DISPATCHED=$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/trust-cycle-report.json")).get("result",{}).get("dispatched") is True)')
          CHILDREN=$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/trust-cycle-report.json")).get("result",{}).get("childCount") or 0)')
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "dispatched=$DISPATCHED" >> "$GITHUB_OUTPUT"
          echo "child_count=$CHILDREN" >> "$GITHUB_OUTPUT"
          if [[ "$CHILDREN" != "0" && "$CHILDREN" != "1" ]]; then
            echo "::error::controller dispatched $CHILDREN children; max allowed is 1"
            exit 1
          fi

      - name: Local Host D health snapshot (self-hosted)
        if: success()
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4140/api/health | tee "$RUNNER_TEMP/health.json"
          curl -fsS http://127.0.0.1:4140/api/settings | python3 -c 'import sys,json;d=json.load(sys.stdin); assert d.get("enginePaused") is True; print("enginePaused=true")'
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          health=json.load(open(os.environ["RUNNER_TEMP"]+"/health.json"))
          rp=Path(os.environ["RUNNER_TEMP"])/"trust-cycle-report.json"
          report=json.loads(rp.read_text()) if rp.exists() else {}
          report["liveHealth"]= {"status": health.get("status"), "version": health.get("version")}
          report["recordedUtc"]= datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          rp.write_text(json.dumps(report, indent=2)+"\n")
          print(json.dumps(report["liveHealth"]))
          PY

      - name: Optional local backup/restore when decided
        if: steps.decide.outputs.action == 'local-backup-restore'
        run: |
          set -euo pipefail
          # Only when controller selected this action; still fail-closed as root tooling.
          sudo /usr/local/sbin/staging-backup.sh | tee "$RUNNER_TEMP/backup.log"
          sudo /usr/local/sbin/staging-restore-test.sh | tee "$RUNNER_TEMP/restore.log"
          curl -fsS http://127.0.0.1:4140/api/health | python3 -c 'import sys,json;d=json.load(sys.stdin); assert d.get("status")=="ok"'

      - name: Checkpoint comment on tracking issue #109
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BODY=$(python3 - <<'PY'
          import json, os
          r=json.load(open(os.environ["RUNNER_TEMP"]+"/trust-cycle-report.json"))
          d=r.get("decision") or {}
          res=r.get("result") or {}
          lines=[
            "## Host D trust-cycle controller checkpoint",
            "",
            f"- controller_run: `{os.environ.get('GITHUB_RUN_ID','')}`",
            f"- event: `{os.environ.get('EVENT_NAME', os.environ.get('GITHUB_EVENT_NAME',''))}`",
            f"- recordedUtc: `{r.get('recordedUtc')}`",
            f"- action: `{d.get('action')}`",
            f"- reason: `{d.get('reason')}`",
            f"- dispatched: `{res.get('dispatched')}`",
            f"- childCount: `{res.get('childCount')}`",
            f"- hostPAccessCount: `{r.get('hostPAccessCount')}`",
            f"- liveHealth: `{json.dumps(r.get('liveHealth'))}`",
            f"- inProgressTrustRuns: `{json.dumps(r.get('inProgressTrustRuns'))}`",
            f"- counters: `{json.dumps(r.get('counters'))}`",
            "",
            "Durable controller — schedule may execute at most one eligible child; no Cursor wait.",
          ]
          print("\n".join(lines))
          PY
          )
          gh issue comment 109 --repo Appsolino/Fusion --body "$BODY"

      - name: Upload cycle report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-d-trust-cycle-${{ github.run_id }}
          path: ${{ runner.temp }}/trust-cycle-report.json
          if-no-files-found: warn
          retention-days: 30
