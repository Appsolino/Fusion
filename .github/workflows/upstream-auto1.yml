# FNXC:AppsolinoAuto1 2026-07-31-12:40:
# AUTO-1: scheduled/manual upstream integration into automation/upstream-<sha> via merge --no-ff.
# Never force-pushes or updates Appsolino main. Never builds or deploys Host D (AUTO-2/AUTO-3).
# Routine identity: Appsolino Automation GitHub App only — fail closed when App credentials are missing.
# Observation-only detection remains in upstream-shadow.yml.
#
# FNXC:AppsolinoAuto1 2026-07-31-16:05:
# Live push auth: persist-credentials stays false after checkout, so configure `gh auth setup-git`
# with the App installation token before any git push. Probe with non-mutating `git ls-remote`.
# App token action is v3 with explicit contents/pull-requests/workflows write permissions.

name: Upstream AUTO-1 Sync

on:
  schedule:
    # FNXC:UpstreamFreshness 2026-08-07-04:35:
    # Hourly observation — daily polling allowed Appsolino to go stale while SENSITIVE PRs parked.
    # Source freshness stays independent of Host D/Host P deployment.
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto1-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare upstream sync branch + PR
    runs-on: ubuntu-latest
    steps:
      - name: Require Appsolino Automation GitHub App credentials
        shell: bash
        env:
          APP_ID: ${{ secrets.APPSOLINO_AUTOMATION_APP_ID }}
          APP_KEY: ${{ secrets.APPSOLINO_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID}" || -z "${APP_KEY}" ]]; then
            echo "::error::AUTO-1 fail-closed: APPSOLINO_AUTOMATION_APP_ID / APPSOLINO_AUTOMATION_APP_PRIVATE_KEY missing. Owner OAuth and ad-hoc PATs are not the routine automation identity."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APPSOLINO_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.APPSOLINO_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout Appsolino
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure GitHub App authentication for git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Appsolino Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # FNXC:UpstreamLatency 2026-08-07-17:40:
      # Scheduled AUTO-1 must not force-rebuild a candidate while SENSITIVE_REVIEW / repair is active
      # for the same live upstream tip — that cancelled live AI work mid-cycle on #144.
      - name: Skip rebuild when expert/sensitive-review owns matching candidate
        id: skip-active-expert
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          LIVE="$(gh api repos/Runfusion/Fusion/commits/main --jq .sha | tr '[:upper:]' '[:lower:]')"
          echo "live_upstream=$LIVE"
          PRS="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 --json number,headRefName,labels)"
          SKIP="$(PRS="$PRS" LIVE="$LIVE" python3 - <<'PY'
import json, os, sys
prs=json.loads(os.environ["PRS"])
live=os.environ["LIVE"].lower()
active=False
for p in prs:
  ref=str(p.get("headRefName") or "")
  if not ref.startswith("automation/upstream-"):
    continue
  sha=ref.split("automation/upstream-",1)[-1].lower()
  labels={str(l.get("name") or "") for l in (p.get("labels") or [])}
  busy=bool(labels & {"auto2:sensitive-review","auto2:expert-resolving","auto2:ai-verifying"})
  if busy and (live.startswith(sha) or sha.startswith(live[:12])):
    active=True
    print(f"active_expert_pr={p.get('number')} labels={sorted(labels)}", file=sys.stderr)
    break
print("true" if active else "false")
PY
)"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [[ "$SKIP" == "true" ]]; then
            echo "::notice::AUTO-1 skip: sensitive-review/expert owns matching upstream candidate — refuse mid-cycle rebuild"
          fi

      - name: Probe App git authentication (non-mutating)
        if: steps.skip-active-expert.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Fail closed before merge/push if App credentials cannot talk to origin.
          git ls-remote --exit-code origin HEAD >/dev/null

      # FNXC:UpstreamPatchReconcile 2026-08-07-07:20:
      # UPSTREAM_FIXED conflict resolution runs INSIDE AUTO-1 sync and needs node+pnpm
      # for clean-upstream regression (pnpm check:lane-wiring). Setup must precede sync.
      - name: Setup Node + pnpm (required for in-sync Finding Comparison)
        if: steps.skip-active-expert.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack pnpm
        if: steps.skip-active-expert.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          node -v
          pnpm -v

      - name: Run AUTO-1 sync
        if: steps.skip-active-expert.outputs.skip != 'true'
        id: sync
        shell: bash
        env:
          AUTO1_GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # FNXC:AppsolinoAuto1 2026-07-31-16:05: never inherit owner interactive gh config.
          GH_CONFIG_DIR: ${{ runner.temp }}/auto1-gh-config
        run: |
          set -euo pipefail
          mkdir -p "$GH_CONFIG_DIR"
          set +e
          node infra/scripts/auto1-upstream-sync.mjs \
            --repo-dir "$GITHUB_WORKSPACE" \
            --push \
            --create-pr \
            --gh-repo "$GITHUB_REPOSITORY" \
            --json > /tmp/auto1-result.json
          code=$?
          set -e
          cat /tmp/auto1-result.json
          {
            echo "## AUTO-1 result"
            echo
            echo '```json'
            cat /tmp/auto1-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          outcome="$(python3 -c 'import json;print(json.load(open("/tmp/auto1-result.json"))["outcome"])')"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          upstream_sha="$(python3 -c 'import json;d=json.load(open("/tmp/auto1-result.json"));print(d.get("upstreamSha") or "")')"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          appsolino_sha="$(python3 -c 'import json;d=json.load(open("/tmp/auto1-result.json"));print(d.get("appsolinoSha") or "")')"
          echo "appsolino_sha=$appsolino_sha" >> "$GITHUB_OUTPUT"
          sync_branch="$(python3 -c 'import json;d=json.load(open("/tmp/auto1-result.json"));print(d.get("syncBranch") or "")')"
          echo "sync_branch=$sync_branch" >> "$GITHUB_OUTPUT"
          # conflict → workflow fails visibly; no-change/merged → success
          if [[ "$outcome" == "conflict" || "$code" -eq 2 ]]; then
            exit 2
          fi
          exit "$code"

      - name: Finding Comparison — reconcile remaining patches on clean upstream
        if: steps.skip-active-expert.outputs.skip != 'true' && steps.sync.outputs.outcome == 'merged' && steps.sync.outputs.upstream_sha != ''
        id: patch-reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          UPSTREAM_BEFORE: ${{ steps.sync.outputs.appsolino_sha }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
        run: |
          set -euo pipefail
          # FNXC:UpstreamPatchReconcile 2026-08-07-05:55:
          # Automation-only retirement proof against exact clean upstream tip. Do not hand-edit registry.
          # Covering-patch retirement may already have happened during conflict resolution inside sync.
          node infra/scripts/upstream/run-patch-reconcile-live.mjs \
            --repo-dir "$GITHUB_WORKSPACE" \
            --upstream-sha "$UPSTREAM_SHA" \
            --upstream-before "$UPSTREAM_BEFORE" \
            --json > /tmp/patch-reconcile.json
          cat /tmp/patch-reconcile.json
          {
            echo "## Patch reconciliation (clean upstream)"
            echo
            echo '```json'
            cat /tmp/patch-reconcile.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$(git status --porcelain .appsolino/patches || true)" ]]; then
            git add .appsolino/patches
            git commit -m "chore(auto1): reconcile product patches against upstream ${UPSTREAM_SHA:0:12}"
            git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi

      - name: Guard — no Host D deploy in AUTO-1
        shell: bash
        run: |
          set -euo pipefail
          echo "AUTO-1 does not build, install, or activate Host D releases."
