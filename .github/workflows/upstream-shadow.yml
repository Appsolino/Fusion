# FNXC:AppsolinoUpstream 2026-07-31-03:42:
# Observation-only daily monitor of Runfusion/Fusion main vs Appsolino main.
# Exact-tip upstream-shadow mirroring failed (run 30601438029): Actions default credentials cannot update workflow files present in upstream history.
# Do not force-push upstream history, create upstream-shadow, import upstream workflows, or add external credentials to bypass that restriction.
# Full automated absorb (automation/upstream-* + risk-gated PR + Host D release) is REQUIRED / NOT IMPLEMENTED — see docs/appsolino/OPERATING-MODEL.md §3 and docs/appsolino/upstream/UPSTREAM-MONITORING.md.

name: Upstream Monitor

on:
  schedule:
    # Daily ~06:15 UTC — detection/observation only; not an absorb or Host D deploy.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Compare Appsolino with upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Appsolino
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Fetch and compare upstream
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_URL="https://github.com/Runfusion/Fusion.git"
          APPSOLINO_MAIN_REF="origin/main"

          git remote add upstream "$UPSTREAM_URL" 2>/dev/null \
            || git remote set-url upstream "$UPSTREAM_URL"

          git fetch --no-tags upstream main
          git fetch --no-tags origin main

          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          APPSOLINO_SHA="$(git rev-parse "$APPSOLINO_MAIN_REF")"
          MERGE_BASE="$(git merge-base "$APPSOLINO_MAIN_REF" upstream/main)"
          AHEAD="$(git rev-list --count upstream/main.."$APPSOLINO_MAIN_REF")"
          BEHIND="$(git rev-list --count "$APPSOLINO_MAIN_REF"..upstream/main)"

          {
            echo "## Upstream monitor"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream tip | \`${UPSTREAM_SHA}\` |"
            echo "| Appsolino main | \`${APPSOLINO_SHA}\` |"
            echo "| Merge-base | \`${MERGE_BASE}\` |"
            echo "| Appsolino ahead | ${AHEAD} |"
            echo "| Appsolino behind | ${BEHIND} |"
            echo "| Repository refs updated | NO |"
            echo "| Automated absorb | REQUIRED / NOT IMPLEMENTED |"
            echo
            echo "Observation only: no branch, merge, install, build or Host D deploy."
          } >> "$GITHUB_STEP_SUMMARY"
