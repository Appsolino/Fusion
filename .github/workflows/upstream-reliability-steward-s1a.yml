# FNXC:AppsolinoStewardS1A 2026-08-04:
# Steward S1A — Expert Advisory Mode (advice only).
# Trust zones:
#   observe-analyze (live): self-hosted fusion runner, GITHUB_TOKEN read ONLY
#   upsert-advice: ubuntu-latest, App token issues:write, artifact upsert ONLY
#   fixture-replay: ubuntu-latest, fixture engine, no upsert
#
# Worktree (advice-only; never push/repair):
#   $S1A_WORKTREE_ROOT/repair-<incident-id>
#   canonical: /srv/appsolino-fusion/phase-1/worktrees/repair-<incident-id>
#
# Live engine (fail closed — never deterministic/fixture):
#   S1A_ENGINE=cursor-cli  S1A_PROVIDER=cursor-cli  S1A_MODEL=composer-2.5

name: Upstream Reliability Steward S1A

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Incident issue number"
        required: true
        type: string
      mode:
        description: "fixture-replay (CI) | live (ops)"
        required: true
        type: choice
        options:
          - fixture-replay
          - live
        default: live

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: steward-s1a-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  observe-analyze:
    name: Eligibility + evidence + expert assess (read-only)
    # Self-hosted fusion host (labels). If unregistered, job stays queued — OK.
    # Documented override: set repo var S1A_ANALYZE_RUNS_ON and edit this job to use it;
    # do NOT retarget live to fixture/deterministic on ubuntu-latest.
    runs-on: [self-hosted, appsolino-fusion]
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'live') ||
      (github.event_name == 'issues' && github.event.label.name == 'steward/needs-expert')
    outputs:
      should_upsert: ${{ steps.gate.outputs.should_upsert }}
      issue_number: ${{ steps.gate.outputs.issue_number }}
      mode: ${{ steps.gate.outputs.mode }}
      skip_reason: ${{ steps.gate.outputs.skip_reason }}
      artifact_ready: ${{ steps.analyze.outputs.artifact_ready }}
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Guard S1A trust invariants
        run: |
          set -euo pipefail
          f=.github/workflows/upstream-reliability-steward-s1a.yml
          grep -q 'ref: main' "$f"
          if awk '/gh[[:space:]]+workflow[[:space:]]+run/ && $0 !~ /grep|echo|::error/ { found=1; print } END { exit found?0:1 }' "$f"; then
            echo "::error::S1A must not dispatch AUTO/other workflows via CLI"
            exit 1
          fi
          if awk '/gh[[:space:]]+run[[:space:]]+rerun/ && $0 !~ /grep|echo|::error/ { found=1; print } END { exit found?0:1 }' "$f"; then
            echo "::error::S1A must not rerun workflow runs via CLI"
            exit 1
          fi
          if grep -nE '\$\{\{[[:space:]]*secrets\.(HOST_D|HOST_P)_' "$f"; then
            echo "::error::S1A must not reference Host D/P secrets"
            exit 1
          fi
          if grep -nE '^[[:space:]]*issues:[[:space:]]*write' "$f"; then
            echo "::error::workflow GITHUB_TOKEN must not have issues:write"
            exit 1
          fi
          node infra/scripts/steward/s1a/guard-authority.mjs --workflow="$f"
          echo "yaml-parse-ok"

      - name: Gate triggers (activation policy + kill switch)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name || '' }}
          ISSUE_NUMBER_EVENT: ${{ github.event.issue.number || '' }}
          ISSUE_NUMBER_INPUT: ${{ inputs.issue_number || '' }}
          # Only inject when repo var is set. An explicit 'false' default would
          # override activation-policy.json via envOverride and keep Gate A dead.
          S1A_AUTO_HANDOFF: ${{ vars.S1A_AUTO_HANDOFF }}
        run: |
          set -euo pipefail
          MODE="live"
          ISSUE=""
          SKIP=""
          SHOULD="false"

          # Version-controlled policy + emergency KILL file (killSwitch wins).
          ACT="$(node ./infra/scripts/steward/activation/print-gate.mjs s1aAutoHandoff)"
          echo "activation=${ACT}"
          AUTO_ON="$(node -e 'const a=JSON.parse(process.argv[1]); process.stdout.write(a.on?"true":"false")' "${ACT}")"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            ISSUE="${ISSUE_NUMBER_INPUT}"
            MODE="live"
            SHOULD="true"
          elif [[ "${EVENT_NAME}" == "issues" ]]; then
            ISSUE="${ISSUE_NUMBER_EVENT}"
            MODE="live"
            if [[ "${LABEL_NAME}" != "steward/needs-expert" ]]; then
              SKIP="label-not-needs-expert"
              SHOULD="false"
            elif [[ "${AUTO_ON}" != "true" ]]; then
              SKIP="auto-handoff-disabled"
              SHOULD="false"
              echo "S1A labeled event skipped (activation gate s1aAutoHandoff off or killSwitch)"
            else
              SHOULD="true"
            fi
          else
            SKIP="unsupported-event"
            SHOULD="false"
          fi

          echo "issue_number=${ISSUE}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${SKIP}" >> "$GITHUB_OUTPUT"
          echo "should_upsert=${SHOULD}" >> "$GITHUB_OUTPUT"

      - name: Live analyze (cursor-cli — GITHUB_TOKEN read only)
        id: analyze
        if: steps.gate.outputs.should_upsert == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          S1A_ENGINE: cursor-cli
          S1A_PROVIDER: cursor-cli
          S1A_MODEL: composer-2.5
          S1A_MODE: live
          S1A_WORKTREE_ROOT: ${{ vars.S1A_WORKTREE_ROOT || '/srv/appsolino-fusion/phase-1/worktrees' }}
          S1A_OUT_DIR: ${{ runner.temp }}/steward-s1a-writer
          S1A_PRIVATE_DIR: ${{ runner.temp }}/steward-s1a-private
          S1A_CURSOR_API_KEY: ${{ secrets.S1A_CURSOR_API_KEY || '' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY || secrets.S1A_CURSOR_API_KEY || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$S1A_OUT_DIR" "$S1A_PRIVATE_DIR"
          echo "runner.name=${RUNNER_NAME:-}"
          echo "runner.os=${RUNNER_OS:-}"
          echo "user=$(whoami)"
          if [[ "$(whoami)" != "fusion" ]]; then
            echo "::error::S1A analyze must run as fusion (got $(whoami))"
            exit 1
          fi
          if [[ "${S1A_ENGINE}" == "fixture" || "${S1A_ENGINE}" == "deterministic" ]]; then
            echo "::error::live analyze rejects fixture/deterministic engine"
            exit 1
          fi
          # Never use App issues token here — only GITHUB_TOKEN read scopes.
          unset GH_TOKEN || true
          test -d "$S1A_WORKTREE_ROOT" || {
            echo "::error::S1A_WORKTREE_ROOT missing: $S1A_WORKTREE_ROOT"
            exit 1
          }
          # Stdout is a sanitized summary only (no evidencePack).
          node infra/scripts/steward/s1a/run-s1a-analyze.mjs \
            --issue="${{ steps.gate.outputs.issue_number }}" \
            --repo="$GITHUB_REPOSITORY" \
            --mode=live \
            --out="$S1A_OUT_DIR" \
            | tee "$S1A_OUT_DIR/analyze-summary.json"
          # Refuse accidental raw evidence in the writer upload directory.
          if [[ -f "$S1A_OUT_DIR/evidence-pack.json" ]] || [[ -f "$S1A_OUT_DIR/analyze-result.json" ]]; then
            echo "::error::raw evidence must not land in writer artifact directory"
            exit 1
          fi
          if [[ -f "$S1A_OUT_DIR/assessment-artifact.json" ]]; then
            if grep -E '"evidencePack"|"workflowLogs"|"conflictFileSides"|"gitPathLog"' \
              "$S1A_OUT_DIR/assessment-artifact.json"; then
              echo "::error::assessment-artifact contains raw evidence fields"
              exit 1
            fi
            echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload S1A writer artifact (sanitized only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-s1a-${{ github.run_id }}
          path: ${{ runner.temp }}/steward-s1a-writer/
          if-no-files-found: ignore
          retention-days: 14

  fixture-replay:
    name: Fixture engine self-check (no upsert)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fixture-replay'
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Guard S1A trust invariants
        run: |
          set -euo pipefail
          f=.github/workflows/upstream-reliability-steward-s1a.yml
          node infra/scripts/steward/s1a/guard-authority.mjs --workflow="$f"

      - name: Fixture-replay (S1A_ENGINE=fixture — no upsert)
        env:
          S1A_ENGINE: fixture
          S1A_MODE: fixture
          S1A_PROVIDER: appsolino-s1a-fixture
          S1A_MODEL: appsolino-s1a-fixture-v1
          S1A_OUT_DIR: ${{ runner.temp }}/steward-s1a
        run: |
          set -euo pipefail
          mkdir -p "$S1A_OUT_DIR"
          node infra/scripts/steward/s1a/run-s1a-analyze.mjs \
            --issue="${{ inputs.issue_number }}" \
            --repo="${{ github.repository }}" \
            --mode=fixture \
            --out="$S1A_OUT_DIR" \
            > "$S1A_OUT_DIR/fixture-result.json"
          node --test infra/scripts/steward/s1a/__tests__/*.test.mjs
          echo "fixture-replay complete (no upsert)"

      - name: Upload fixture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-s1a-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/steward-s1a/
          if-no-files-found: ignore
          retention-days: 14

  upsert-advice:
    name: Upsert assessment comment + labels (App token)
    needs: observe-analyze
    if: |
      needs.observe-analyze.outputs.should_upsert == 'true' &&
      needs.observe-analyze.outputs.mode == 'live' &&
      needs.observe-analyze.outputs.artifact_ready == 'true' &&
      needs.observe-analyze.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: steward-s1a-upsert-${{ needs.observe-analyze.outputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Download assessment artifact
        uses: actions/download-artifact@v4
        with:
          name: steward-s1a-${{ github.run_id }}
          path: ${{ runner.temp }}/steward-s1a-writer

      - name: Create GitHub App token (issues write)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APPSOLINO_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.APPSOLINO_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: read
          permission-pull-requests: read

      - name: Upsert advice ONLY (no engineer/reviewer)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ART="${{ runner.temp }}/steward-s1a-writer/assessment-artifact.json"
          test -f "$ART"
          if grep -E '"engine"[[:space:]]*:[[:space:]]*"(fixture|deterministic)"' "$ART"; then
            echo "::error::refuse live upsert of fixture/deterministic artifact"
            exit 1
          fi
          if grep -E '"evidencePack"|"workflowLogs"|"conflictFileSides"' "$ART"; then
            echo "::error::refuse writer artifact with raw evidence"
            exit 1
          fi
          node infra/scripts/steward/s1a/run-s1a-upsert.mjs \
            --artifact="$ART" \
            --repo="$GITHUB_REPOSITORY" \
            --expect-mode=live \
            | tee "${{ runner.temp }}/steward-s1a-writer/upsert-result.json"
