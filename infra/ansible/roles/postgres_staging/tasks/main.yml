---
# FNXC:Phase2A 2026-07-29-21:45:
# Isolated staging PostgreSQL identity via psql (no collection dependency).
# Fail closed if production DATABASE_URL markers appear in staging secrets.
# FNXC:Phase2A 2026-07-30-08:05: Enforce password_encryption=scram-sha-256 and TCP host SCRAM in pg_hba; verify role SCRAM verifier without exposing it.

- name: Reject production database URLs in staging secrets
  shell: |
    set -euo pipefail
    f="{{ staging_secrets_file }}"
    if [ -f "$f" ]; then
      if grep -Eiq 'appsolino-prod|/production|fusion_prod|fusion_production' "$f"; then
        echo "PRODUCTION_URL_DETECTED in staging secrets" >&2
        exit 2
      fi
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Install PostgreSQL packages
  apt:
    name:
      - "postgresql-{{ postgres_major }}"
      - "postgresql-client-{{ postgres_major }}"
    state: present

- name: Ensure PostgreSQL started
  service:
    name: postgresql
    state: started
    enabled: true

- name: Enforce password_encryption scram-sha-256
  become_user: postgres
  shell: |
    set -euo pipefail
    cur="$(psql -Atc "SHOW password_encryption;")"
    if [ "$cur" != "scram-sha-256" ]; then
      psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET password_encryption = 'scram-sha-256';"
      psql -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf();"
      echo CHANGED_ENCRYPTION
    fi
  args:
    executable: /bin/bash
  register: pg_enc
  changed_when: "'CHANGED_ENCRYPTION' in pg_enc.stdout"

- name: Enforce SCRAM for staging TCP host rules in pg_hba.conf
  shell: |
    set -euo pipefail
    HBA="/etc/postgresql/{{ postgres_major }}/main/pg_hba.conf"
    changed=0
    # Ensure IPv4/IPv6 localhost scram lines exist for all databases/users (staging connects over TCP).
    for line in \
      'host    all             all             127.0.0.1/32            scram-sha-256' \
      'host    all             all             ::1/128                 scram-sha-256'
    do
      if ! grep -Eq "^$(echo "$line" | sed 's/[[:space:]]+/[[:space:]]+/g')\$" "$HBA"; then
        # Comment out conflicting md5/trust host localhost lines for the same address family
        if echo "$line" | grep -q '127.0.0.1'; then
          sed -i -E 's/^(host[[:space:]]+all[[:space:]]+all[[:space:]]+127\.0\.0\.1\/32[[:space:]]+)(md5|trust|password)[[:space:]]*$/# Phase2A disabled: \1\2/' "$HBA" || true
        else
          sed -i -E 's/^(host[[:space:]]+all[[:space:]]+all[[:space:]]+::1\/128[[:space:]]+)(md5|trust|password)[[:space:]]*$/# Phase2A disabled: \1\2/' "$HBA" || true
        fi
        printf '\n# FNXC:Phase2A SCRAM for localhost TCP\n%s\n' "$line" >> "$HBA"
        changed=1
      fi
    done
    # Retain local peer admin for postgres unix sockets (do not convert local peer lines).
    if ! grep -Eq '^local[[:space:]]+all[[:space:]]+postgres[[:space:]]+peer' "$HBA"; then
      if ! grep -Eq '^local[[:space:]]+all[[:space:]]+all[[:space:]]+peer' "$HBA"; then
        printf '\n# FNXC:Phase2A local peer for postgres admin\nlocal   all             postgres                                peer\n' >> "$HBA"
        changed=1
      fi
    fi
    if [ "$changed" -eq 1 ]; then
      systemctl reload postgresql
      echo CHANGED_HBA
    fi
    exit 0
  args:
    executable: /bin/bash
  register: pg_hba
  changed_when: "'CHANGED_HBA' in pg_hba.stdout"

- name: Read listen_addresses
  become_user: postgres
  command: psql -Atc "SHOW listen_addresses;"
  register: pg_listen
  changed_when: false

- name: Assert localhost-only listen
  assert:
    that:
      - "'*' not in pg_listen.stdout"
      - "('localhost' in pg_listen.stdout) or ('127.0.0.1' in pg_listen.stdout)"
    fail_msg: "PostgreSQL must listen on localhost only; got {{ pg_listen.stdout }}"

- name: Check secrets file
  stat:
    path: "{{ staging_secrets_file }}"
  register: secrets_stat

- name: Generate password if secrets missing
  set_fact:
    staging_db_password_generated: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when: not secrets_stat.stat.exists

- name: Create staging secrets.env (first run only)
  copy:
    dest: "{{ staging_secrets_file }}"
    owner: root
    group: "{{ fusion_group }}"
    mode: "0640"
    content: |
      # Generated by Phase 2A postgres_staging role — do not commit
      DATABASE_URL=postgresql://{{ postgres_staging_role }}:{{ staging_db_password_generated }}@127.0.0.1:5432/{{ postgres_staging_db }}
      STAGING_DB_PASSWORD={{ staging_db_password_generated }}
  when: not secrets_stat.stat.exists
  no_log: true

- name: Load staging DB password
  shell: |
    set -euo pipefail
    if grep -q '^STAGING_DB_PASSWORD=' "{{ staging_secrets_file }}"; then
      grep '^STAGING_DB_PASSWORD=' "{{ staging_secrets_file }}" | cut -d= -f2-
    else
      python3 -c "import re,pathlib; t=pathlib.Path('{{ staging_secrets_file }}').read_text(); m=re.search(r'^DATABASE_URL=postgresql://[^:]+:([^@]+)@',t,re.M); assert m; print(m.group(1))"
    fi
  args:
    executable: /bin/bash
  register: staging_pw
  changed_when: false
  no_log: true

- name: Ensure staging role and database via psql
  become_user: postgres
  shell: |
    set -euo pipefail
    PW='{{ staging_pw.stdout | trim }}'
    ROLE='{{ postgres_staging_role }}'
    DB='{{ postgres_staging_db }}'
    # Create role or refresh password only when SCRAM verifier is missing (idempotent).
    if ! psql -Atc "SELECT 1 FROM pg_roles WHERE rolname='$ROLE'" | grep -q 1; then
      psql -v ON_ERROR_STOP=1 -c "CREATE ROLE $ROLE LOGIN PASSWORD '$PW';"
      echo CHANGED_ROLE
    else
      pref="$(psql -Atc "SELECT left(rolpassword, 13) FROM pg_authid WHERE rolname='$ROLE';")"
      if [ "$pref" != "SCRAM-SHA-256" ]; then
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE $ROLE WITH PASSWORD '$PW';"
        echo CHANGED_ROLE_SCRAM
      fi
    fi
    if ! psql -Atc "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1; then
      psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE $DB OWNER $ROLE ENCODING 'UTF8' TEMPLATE template0;"
      echo CHANGED_DB
    fi
    psql -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE $DB TO $ROLE;"
  args:
    executable: /bin/bash
  register: pg_ensure
  changed_when: "'CHANGED_' in pg_ensure.stdout"
  no_log: true

- name: Verify SCRAM verifier present without exposing secret
  become_user: postgres
  shell: |
    set -euo pipefail
    enc="$(psql -Atc 'SHOW password_encryption;')"
    [ "$enc" = "scram-sha-256" ] || { echo "password_encryption=$enc" >&2; exit 2; }
    # Prefix only — never print full rolpassword.
    pref="$(psql -Atc "SELECT left(rolpassword, 13) FROM pg_authid WHERE rolname='{{ postgres_staging_role }}';")"
    [ "$pref" = "SCRAM-SHA-256" ] || { echo "role password verifier prefix=$pref (expected SCRAM-SHA-256)" >&2; exit 2; }
    hba_scram="$(grep -E '^host[[:space:]]+all[[:space:]]+all[[:space:]]+127\.0\.0\.1/32[[:space:]]+scram-sha-256' /etc/postgresql/{{ postgres_major }}/main/pg_hba.conf | wc -l)"
    [ "$hba_scram" -ge 1 ] || { echo "missing scram host rule for 127.0.0.1" >&2; exit 2; }
    {
      echo "password_encryption=$enc"
      echo "fusion_staging_verifier_prefix=$pref"
      echo "pg_hba_host_127_scram_lines=$hba_scram"
      echo "pg_hba_host_scram_sanitised:"
      grep -E '^host[[:space:]]+' /etc/postgresql/{{ postgres_major }}/main/pg_hba.conf | sed -E 's/[[:space:]]+/ /g' || true
      echo "pg_hba_local_peer_sanitised:"
      grep -E '^local[[:space:]]+' /etc/postgresql/{{ postgres_major }}/main/pg_hba.conf | sed -E 's/[[:space:]]+/ /g' || true
    } > /tmp/pg-scram-proof-staging.txt
  args:
    executable: /bin/bash
  changed_when: false

- name: Write sanitised PostgreSQL identity
  become_user: postgres
  shell: |
    set -euo pipefail
    {
      echo "server_version=$(psql -Atc 'SHOW server_version;')"
      echo "db={{ postgres_staging_db }}"
      echo "owner=$(psql -Atc "SELECT pg_catalog.pg_get_userbyid(datdba) FROM pg_database WHERE datname='{{ postgres_staging_db }}';")"
      echo "encoding=$(psql -Atc "SELECT pg_encoding_to_char(encoding) FROM pg_database WHERE datname='{{ postgres_staging_db }}';")"
      echo "listen=$(psql -Atc 'SHOW listen_addresses;')"
      echo "role={{ postgres_staging_role }}"
      echo "restore_test_db={{ postgres_staging_restore_db }}"
      echo "password_encryption=$(psql -Atc 'SHOW password_encryption;')"
    } > /tmp/pg-identity-staging.txt
  args:
    executable: /bin/bash
  changed_when: false

- name: Install identity file under staging state
  copy:
    src: /tmp/pg-identity-staging.txt
    dest: /srv/appsolino-fusion/staging/state/postgres-identity.txt
    remote_src: true
    owner: "{{ fusion_user }}"
    group: "{{ fusion_group }}"
    mode: "0640"

- name: Install SCRAM proof under staging state
  copy:
    src: /tmp/pg-scram-proof-staging.txt
    dest: /srv/appsolino-fusion/staging/state/postgres-scram-proof.txt
    remote_src: true
    owner: "{{ fusion_user }}"
    group: "{{ fusion_group }}"
    mode: "0640"
