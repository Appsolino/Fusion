---
# FNXC:Phase2A 2026-07-29-21:45: Ensure backup dirs + documented off-host config example.
- name: Ensure backup directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ fusion_group }}"
    mode: "0750"
  loop:
    - "{{ staging_backups }}"
    - "{{ staging_backups }}/meta"

- name: Install off-host backup example config (not enabled)
  copy:
    dest: /etc/appsolino-fusion/staging/off-host-backup.env.example
    owner: root
    group: "{{ fusion_group }}"
    mode: "0640"
    content: |
      # EXAMPLE — copy to off-host-backup.env only after an approved external target exists.
      OFF_HOST_BACKUP_CONFIGURED=false
      OFF_HOST_BACKUP_TARGET=
      # When unset/false, staging-backup.sh reports OFF_HOST_TARGET_NOT_CONFIGURED

- name: Install secrets.env.example under staging etc
  copy:
    dest: /etc/appsolino-fusion/staging/secrets.env.example
    owner: root
    group: "{{ fusion_group }}"
    mode: "0640"
    content: |
      # EXAMPLE ONLY — copy to secrets.env with real values (never commit).
      # DATABASE_URL=postgresql://fusion_staging:REPLACE@127.0.0.1:5432/fusion_staging
      # STAGING_DB_PASSWORD=REPLACE
