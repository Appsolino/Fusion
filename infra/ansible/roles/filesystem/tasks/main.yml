---
# FNXC:Phase2A 2026-07-29-21:45: Formal build/staging path separation; production paths must not exist.
- name: Ensure build environment paths
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ fusion_user }}"
    group: "{{ fusion_group }}"
    mode: "0750"
  loop:
    - "{{ build_root }}"
    - "{{ source_root }}"
    - "{{ pnpm_store }}"
    - /srv/appsolino-fusion/cache
    - /srv/appsolino-fusion/logs
    - /srv/appsolino-fusion/tmp

- name: Ensure staging runtime paths
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ staging_releases }}", owner: root, group: "{{ fusion_group }}", mode: "0755" }
    - { path: /opt/appsolino-fusion/staging, owner: root, group: "{{ fusion_group }}", mode: "0755" }
    - { path: "{{ staging_etc }}", owner: root, group: "{{ fusion_group }}", mode: "0750" }
    - { path: "{{ acceptance_dir }}", owner: root, group: "{{ fusion_group }}", mode: "0770" }
    - { path: "{{ staging_state }}", owner: "{{ fusion_user }}", group: "{{ fusion_group }}", mode: "0750" }
    - { path: "{{ staging_fusion_home }}", owner: "{{ fusion_user }}", group: "{{ fusion_group }}", mode: "0750" }
    - { path: "{{ staging_workspaces }}", owner: "{{ fusion_user }}", group: "{{ fusion_group }}", mode: "0750" }
    - { path: "{{ staging_project }}", owner: "{{ fusion_user }}", group: "{{ fusion_group }}", mode: "0750" }
    - { path: "{{ staging_worktrees }}", owner: "{{ fusion_user }}", group: "{{ fusion_group }}", mode: "0750" }
    - { path: "{{ staging_logs }}", owner: "{{ fusion_user }}", group: "{{ fusion_group }}", mode: "0750" }
    - { path: "{{ staging_backups }}", owner: root, group: "{{ fusion_group }}", mode: "0750" }
    - { path: /srv/appsolino-fusion/staging, owner: "{{ fusion_user }}", group: "{{ fusion_group }}", mode: "0750" }

- name: Ensure runtime dir via tmpfiles
  copy:
    dest: /etc/tmpfiles.d/appsolino-fusion-staging.conf
    mode: "0644"
    content: |
      d {{ staging_run }} 0750 {{ fusion_user }} {{ fusion_group }} -
      d {{ monitoring_textfile_dir }} 0755 root root -

- name: Apply tmpfiles
  command: systemd-tmpfiles --create /etc/tmpfiles.d/appsolino-fusion-staging.conf
  changed_when: false

- name: Assert production reserved paths are absent on Host D
  stat:
    path: "{{ item }}"
  register: prod_paths
  loop: "{{ production_reserved_paths }}"

- name: Fail if production paths exist
  assert:
    that:
      - not (item.stat.exists | default(false))
    fail_msg: "Production path {{ item.item }} must not exist on Host D (Phase 2A)"
  loop: "{{ prod_paths.results }}"
