---
# FNXC:Phase2A 2026-07-29-21:45: Pin Node 22 + Corepack + pnpm 10.33.0 (already present on Host D).
- name: Check node version
  command: node --version
  register: node_ver
  changed_when: false

- name: Assert Node major
  assert:
    that:
      - node_ver.stdout is match('^v' + node_major)
    fail_msg: "Expected Node {{ node_major }}, got {{ node_ver.stdout }}"

- name: Ensure corepack available
  command: corepack --version
  register: corepack_ver
  changed_when: false

- name: Prepare pinned pnpm
  command: corepack prepare pnpm@{{ pnpm_version }} --activate
  changed_when: false

- name: Check pnpm version
  command: corepack pnpm@{{ pnpm_version }} --version
  register: pnpm_ver
  changed_when: false

- name: Assert pnpm version
  assert:
    that:
      - pnpm_ver.stdout | trim == pnpm_version
