---
# FNXC:Phase2A 2026-07-29-21:45:
# Shared defaults for Appsolino Fusion Host D staging foundation (Phase 2A).
# Production paths are documentation-only and must never receive credentials.

appsolino_org: appsolino-fusion
fusion_user: fusion
fusion_group: fusion
appsolino_timezone: UTC
node_major: "22"
pnpm_version: "10.33.0"
postgres_major: "16"
staging_http_port: 4140
staging_bind_host: "127.0.0.1"
apparmor_restrict_unprivileged_userns: "0"

build_root: /srv/appsolino-fusion/build
source_root: /srv/appsolino-fusion/source
pnpm_store: /srv/appsolino-fusion/cache/pnpm

staging_releases: /opt/appsolino-fusion/staging/releases
staging_current: /opt/appsolino-fusion/staging/current
staging_etc: /etc/appsolino-fusion/staging
staging_state: /srv/appsolino-fusion/staging/state
staging_workspaces: /srv/appsolino-fusion/staging/workspaces
staging_worktrees: /srv/appsolino-fusion/staging/worktrees
staging_logs: /srv/appsolino-fusion/staging/logs
staging_backups: /srv/appsolino-fusion/staging/backups
staging_run: /run/appsolino-fusion/staging
staging_fusion_home: /srv/appsolino-fusion/staging/state/fusion-home
staging_project: /srv/appsolino-fusion/staging/workspaces/project
staging_secrets_file: /etc/appsolino-fusion/staging/secrets.env
staging_env_file: /etc/appsolino-fusion/staging/fusion.env

# Production path names reserved in docs only — never configured on Host D
production_reserved_paths:
  - /opt/appsolino-fusion/production
  - /etc/appsolino-fusion/production
  - /srv/appsolino-fusion/production

postgres_staging_role: fusion_staging
postgres_staging_db: fusion_staging
postgres_staging_restore_db: fusion_staging_restore_test

monitoring_textfile_dir: /var/lib/node_exporter/textfile_collector
acceptance_dir: /etc/appsolino-fusion/staging/acceptance
