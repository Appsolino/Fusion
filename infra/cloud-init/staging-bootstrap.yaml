#cloud-config
# FNXC:Phase2A 2026-07-29-21:45:
# Minimal first-boot bootstrap for a clean Ubuntu 24.04 staging host.
# Ansible remains the authoritative configuration system after bootstrap.
timezone: UTC
package_update: true
packages:
  - git
  - curl
  - ca-certificates
  - python3
  - python3-pip
  - ansible
  - ufw
  - chrony
  - bubblewrap
users:
  - name: fusion
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
runcmd:
  - [timedatectl, set-timezone, UTC]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, 22/tcp]
  - [ufw, --force, enable]
  - [sysctl, -w, kernel.apparmor_restrict_unprivileged_userns=0]
